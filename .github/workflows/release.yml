# Release skeleton: push a tag vX.Y.Z → checks that VERSION, studio/package.json and every manifest carry X.Y.Z,
# runs the validators, renders the sample, and drafts a GitHub release with the CHANGELOG section + the sample MP4.
# Publishing stays a manual click on the draft. Nothing is published to npm.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REMOTION_GL: swangle
      LAUNCHFILM_NO_CREDIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e '
            const fs=require("fs"); const tag=process.argv[1]; const bad=[];
            const v=(f,get)=>{ if(!fs.existsSync(f)) return; const x=get(JSON.parse(fs.readFileSync(f,"utf8"))); if(x!==tag) bad.push(f+"="+x); };
            if (fs.existsSync("VERSION") && fs.readFileSync("VERSION","utf8").trim()!==tag) bad.push("VERSION");
            v("studio/package.json",j=>j.version); v(".claude-plugin/plugin.json",j=>j.version); v("plugin.json",j=>j.version);
            v("gemini-extension.json",j=>j.version); v(".claude-plugin/marketplace.json",j=>j.plugins[0].version);
            if (bad.length) { console.error("version mismatch with tag "+tag+": "+bad.join(", ")); process.exit(1); }' "$TAG"
      - run: npm ci --prefix studio --no-audit --no-fund
      - run: node scripts/sync-skills.mjs --check
      - run: node scripts/validate-recipes.mjs
      - run: node scripts/build-index.mjs --check
      - run: node scripts/check-media.mjs
      - name: Render the sample
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          cd studio && npx remotion browser ensure && npm run render:sample
      - name: Release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then awk -v t="$TAG" '/^## /{p = ($0 ~ "\\[?v?"t"\\]?")} p' CHANGELOG.md > notes.md; fi
          [ -s notes.md ] || echo "launchfilm $GITHUB_REF_NAME" > notes.md
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "launchfilm $GITHUB_REF_NAME" --notes-file notes.md studio/out/_sample.mp4
