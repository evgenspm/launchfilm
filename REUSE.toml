# REUSE 3.3 (https://reuse.software/spec-3.3/): licences by glob. `reuse lint` runs in CI.
# Code, skills, craft docs, schemas and config: MIT. Our own media: CC0 (procedural SFX) or CC BY 4.0 (films, previews).
# Fonts: OFL-1.1 by their authors. Third-party audio (Kenney packs, music beds) is fetched on install, never committed.
version = 1
SPDX-PackageName = "launchfilm"
SPDX-PackageSupplier = "Eugene Li <https://github.com/evgenspm>"
SPDX-PackageDownloadLocation = "https://github.com/evgenspm/launchfilm"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Eugene Li"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["studio/public/sfx/*.wav"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Eugene Li (launchfilm procedural presets, generated by `launchfilm sfx gen`)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["examples/**/media/**", "docs/media/**", "studio/films/**/*.png", "studio/films/**/*.jpg", "studio/src/recipes/**/*.png", "studio/src/recipes/**/*.jpg", "studio/src/recipes/**/*.mp4"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Eugene Li"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "studio/public/fonts/inter/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["studio/public/fonts/geist/**", "studio/public/fonts/geist-mono/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 The Geist Project Authors (https://github.com/vercel/geist-font)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "studio/public/fonts/jetbrains-mono/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "studio/public/fonts/manrope/**"
precedence = "override"
SPDX-FileCopyrightText = "2018 The Manrope Project Authors (https://github.com/googlefonts/manrope)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "studio/public/fonts/unbounded/**"
precedence = "override"
SPDX-FileCopyrightText = "2022 The Unbounded Project Authors (https://github.com/googlefonts/unbounded)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "studio/public/fonts/manifest.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Eugene Li"
SPDX-License-Identifier = "MIT"
